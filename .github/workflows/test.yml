name: Exhibition checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install app and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check AI math, API, replay and recovery
        run: python -m pytest -q
      - name: Check exhibition interaction logic
        run: node --test tests/test_ui.cjs
      - name: Check JavaScript syntax
        run: node --check web/app.js
